spring:
  application:
    name: walletd
  datasource:
    # Matches compose.yaml for local runs; override with SPRING_DATASOURCE_* in deploys.
    url: jdbc:postgresql://localhost:5432/walletd
    username: walletd
    password: walletd
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate   # Flyway owns the schema
  flyway:
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
