spring:
  application:
    name: walletd
  datasource:
    # Matches compose.yaml for local runs; override with SPRING_DATASOURCE_* in deploys.
    url: jdbc:postgresql://localhost:5432/walletd
    username: walletd
    password: walletd
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate   # Flyway owns the schema
    properties:
      hibernate:
        order_updates: true  # same row-lock order in every transaction: fewer deadlocks
  mvc:
    problemdetails:
      enabled: true          # RFC 9457 bodies for validation and binding errors too
  flyway:
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

walletd:
  security:
    jwt-secret: ${WALLETD_JWT_SECRET:}          # required: at least 32 characters
    dev-token-endpoint: ${WALLETD_DEV_TOKENS:false}   # POST /dev/token; local demos only
    issuer: walletd
    token-ttl: 1h

springdoc:
  swagger-ui:
    path: /docs
