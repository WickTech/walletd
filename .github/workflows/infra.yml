name: Infrastructure

# Checks the OpenTofu code in infra/aws without needing an AWS account: formatting, validation, lint and a
# security scan. Everything here is free and open source (OpenTofu, TFLint, Trivy).

on:
  push:
    branches: [main]
    paths: ["infra/**", ".github/workflows/infra.yml"]
  pull_request:
    paths: ["infra/**", ".github/workflows/infra.yml"]

permissions:
  contents: read

jobs:
  validate:
    name: Format, validate, lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/aws
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: 1.13.2
      - name: Format
        run: tofu fmt -check -recursive -diff
      - name: Init (no backend, no credentials)
        run: tofu init -backend=false -input=false
      - name: Validate
        run: tofu validate
      - uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337 # v6.3.2
      - name: Lint
        run: |
          tflint --init
          tflint --format compact

  security:
    name: Security scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Trivy config scan (fails on HIGH or CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: infra/aws
          severity: HIGH,CRITICAL
          exit-code: "1"
