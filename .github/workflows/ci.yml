name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: Build and test (embedded PostgreSQL)
        run: ./mvnw -B verify
      - name: Test again on postgres:17 in Docker (Testcontainers)
        run: ./mvnw -B verify -Pcontainer

  docker:
    name: Docker image smoke test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: walletd
          POSTGRES_USER: walletd
          POSTGRES_PASSWORD: walletd
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U walletd"
          --health-interval 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Build the image
        run: docker build -t walletd:ci .
      - name: Start it against Postgres
        run: |
          docker run -d --name walletd --network host \
            -e SPRING_DATASOURCE_URL=jdbc:postgresql://localhost:5432/walletd \
            -e SPRING_DATASOURCE_USERNAME=walletd \
            -e SPRING_DATASOURCE_PASSWORD=walletd \
            -e WALLETD_JWT_SECRET=ci-jwt-secret-ci-jwt-secret-ci-jwt-secret-01 \
            -e WALLETD_WEBHOOK_SECRET=ci-hook-secret-ci-hook-secret-ci-hook-secret \
            -e WALLETD_DEV_TOKENS=true \
            walletd:ci
          for i in $(seq 1 40); do
            curl -fs localhost:8080/actuator/health | grep -q '"status":"UP"' && exit 0
            sleep 3
          done
          docker logs walletd
          exit 1
      - name: End-to-end smoke test
        env:
          WALLETD_WEBHOOK_SECRET: ci-hook-secret-ci-hook-secret-ci-hook-secret
        run: scripts/smoke.sh
      - name: Container logs
        if: failure()
        run: docker logs walletd

  dependency-scan:
    name: Dependency vulnerability scan (Trivy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Trivy fs scan (fails on fixable HIGH or CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
