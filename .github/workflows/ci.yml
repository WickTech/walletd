name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: Build and test (embedded PostgreSQL)
        run: ./mvnw -B verify
      - name: Test again on postgres:17 in Docker (Testcontainers)
        run: ./mvnw -B verify -Pcontainer
