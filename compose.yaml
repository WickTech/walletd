services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: walletd
      POSTGRES_USER: walletd
      POSTGRES_PASSWORD: walletd
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U walletd"]
      interval: 5s
      retries: 10
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
